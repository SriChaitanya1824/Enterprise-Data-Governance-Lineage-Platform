[project]
name = "enterprise-governance"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "alembic>=1.14,<2",
 "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "great-expectations>=1.3,<2",
 "pandas>=2.2,<3", "openlineage-python>=1.30,<2", "httpx>=0.28,<1", "pycountry>=24.6"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.9", "black>=25", "mypy>=1.14"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.black]
line-length = 100
target-version = ["py312"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.config"
disable_error_code = ["call-arg"]
